## Llama-3-8B Baseline
##
## Replicates the baseline verification-collapse experiment on a second model
## family (Meta-Llama-3-8B-Instruct) to test generalisability.
##
## Key differences from baseline.yaml:
##   - model.name: meta-llama/Meta-Llama-3-8B-Instruct
##   - subset_size: 500 (400 train / 100 val)  — larger than original 250
##   - separate output/log dirs
##
## Everything else (QLoRA r=16, 20 iters, self_score filter, seed 42) is
## identical to the Qwen2.5-7B baseline for a direct cross-model comparison.
##
## Access: requires HF_TOKEN with access to meta-llama/Meta-Llama-3-8B-Instruct
##   export HF_TOKEN=hf_...

model:
  name: "meta-llama/Meta-Llama-3-8B-Instruct"
  quantization:
    load_in_4bit: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  use_dora: false
  task_type: "CAUSAL_LM"

training:
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch = 32
  num_train_epochs: 1
  max_grad_norm: 1.0
  optimizer: "adamw"
  gradient_checkpointing: true
  bf16: true
  logging_steps: 5
  save_strategy: "no"
  gen_batch_size: 128

data:
  dataset_name: "EleutherAI/hendrycks_math"
  dataset_config: null
  level_filter: [3, 4, 5]
  subset_size: 500        # 400 train / 100 val
  train_ratio: 0.8
  max_seq_length: 1024
  max_new_tokens: 512
  seed: 42
  cache_path: "data/math_subset_500.json"

experiment:
  num_iterations: 20
  training_filter: "self_score"      # same collapse-inducing filter as baseline
  hard_negative_injection_interval: 9999   # disabled — pure baseline
  hard_negative_ratio: 0.0
  confidence_threshold: 0.7
  checkpoint_interval: 5
  output_dir: "models/llama3_baseline"
  log_dir: "logs/llama3_baseline"

wandb:
  enabled: false
  project: "rsi-verification-collapse"
  entity: null
  tags: ["llama3-8b-instruct", "math-l3-5", "lora", "baseline", "no-injection", "h100-sxm"]
