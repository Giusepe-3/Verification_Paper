## Mistral-7B-Instruct-v0.3 Baseline
##
## Replicates the baseline verification-collapse experiment on a third model
## family (mistralai/Mistral-7B-Instruct-v0.3) to further test generalisability.
##
## Key differences from baseline.yaml:
##   - model.name: mistralai/Mistral-7B-Instruct-v0.3
##   - subset_size: 500 (400 train / 100 val)
##   - separate output/log dirs
##
## Everything else (QLoRA r=16, 20 iters, self_score filter, seed 42) is
## identical to the Qwen2.5-7B baseline for a direct cross-model comparison.
##
## Notes:
##   - Mistral tokenizer does not define pad_token by default; verifier.py
##     already handles this by setting pad_token = eos_token on load.
##   - No HF_TOKEN needed for Mistral-7B-Instruct-v0.3 (public model).

model:
  name: "mistralai/Mistral-7B-Instruct-v0.3"
  quantization:
    load_in_4bit: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  use_dora: false
  task_type: "CAUSAL_LM"

training:
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch = 32
  num_train_epochs: 1
  max_grad_norm: 1.0
  optimizer: "adamw"
  gradient_checkpointing: true
  bf16: true
  logging_steps: 5
  save_strategy: "no"
  gen_batch_size: 128

data:
  dataset_name: "EleutherAI/hendrycks_math"
  dataset_config: null
  level_filter: [3, 4, 5]
  subset_size: 500        # 400 train / 100 val
  train_ratio: 0.8
  max_seq_length: 1024
  max_new_tokens: 512
  seed: 42
  cache_path: "data/math_subset_500.json"

experiment:
  num_iterations: 20
  training_filter: "self_score"      # same collapse-inducing filter as baseline
  hard_negative_injection_interval: 9999   # disabled — pure baseline
  hard_negative_ratio: 0.0
  confidence_threshold: 0.7
  checkpoint_interval: 5
  output_dir: "models/mistral_baseline"
  log_dir: "logs/mistral_baseline"

wandb:
  enabled: false
  project: "rsi-verification-collapse"
  entity: null
  tags: ["mistral-7b-instruct-v0.3", "math-l3-5", "lora", "baseline", "no-injection", "h100-sxm"]
