## Recovery Experiment
##
## Starts from the already-collapsed Qwen2.5-7B iter-20 checkpoint
## (models/baseline/iter_020) and applies adversarial injection from
## iteration 1. Tests whether injection is *corrective* (can reverse
## collapse after the fact) in addition to *preventive*.
##
## This produces the "collapse → recovery" curve: the model enters
## already collapsed (gap ~0.320) and we track whether injection drives
## the gap back down over 20 further iterations.
##
## Key differences from injection.yaml:
##   - model.init_checkpoint: loads collapsed LoRA adapter as starting state
##   - hard_negative_injection_interval: 1  (inject every iteration — maximum
##     recalibration pressure, most likely to show recovery)
##   - subset_size: 500 (400 train / 100 val — more signal)
##
## Expected result: gap falls from ~0.320 toward injection steady-state
## (~0.170), demonstrating the fix is corrective, not just preventive.
##
## NOTE: models/baseline/iter_020 must exist on this pod.
## Copy it from the baseline pod before launching, or mount shared storage.

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  init_checkpoint: "models/baseline_500/iter_020"   # collapsed checkpoint (from baseline_500.yaml)
  quantization:
    load_in_4bit: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  use_dora: false
  task_type: "CAUSAL_LM"

training:
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch = 32
  num_train_epochs: 1
  max_grad_norm: 1.0
  optimizer: "adamw"
  gradient_checkpointing: true
  bf16: true
  logging_steps: 5
  save_strategy: "no"
  gen_batch_size: 128

data:
  dataset_name: "EleutherAI/hendrycks_math"
  dataset_config: null
  level_filter: [3, 4, 5]
  subset_size: 500
  train_ratio: 0.8
  max_seq_length: 1024
  max_new_tokens: 512
  seed: 42
  cache_path: "data/math_subset_500.json"

experiment:
  num_iterations: 20
  training_filter: "self_score"
  hard_negative_injection_interval: 1    # inject every iteration — max recalibration
  hard_negative_ratio: 0.5
  confidence_threshold: 0.7
  checkpoint_interval: 5
  output_dir: "models/recovery"
  log_dir: "logs/recovery"

wandb:
  enabled: false
  project: "rsi-verification-collapse"
  entity: null
  tags: ["qwen2.5-7b-instruct", "math-l3-5", "lora", "recovery", "injection", "corrective", "a100-80gb"]
